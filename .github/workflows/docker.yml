name: Docker image

on:
  push:
    paths:
      - Dockerfile
      - requirements.txt
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The CUDA base image plus the audio stack needs more room than a
      # default runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Build image
        run: docker build -t audio-to-rag:ci .

      # Imports only: no GPU, no AWS call, no model download.
      - name: Smoke test
        run: |
          docker run --rm audio-to-rag:ci python -c "
          import torch, torchaudio, whisper, faiss, librosa, boto3, numpy
          import pyannote.audio
          print('torch', torch.__version__)
          print('torchaudio', torchaudio.__version__)
          print('pyannote.audio', pyannote.audio.__version__)
          print('numpy', numpy.__version__)
          print('faiss', faiss.__version__)
          "
          docker run --rm audio-to-rag:ci ffmpeg -version | head -1
          docker run --rm audio-to-rag:ci pip list --format=freeze | grep -iE '^(torch|torchaudio|pyannote|numpy|openai-whisper|faiss|librosa|boto3)'

      - name: Image size
        run: docker images audio-to-rag:ci --format '{{.Size}}'
